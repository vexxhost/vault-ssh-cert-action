name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck sign.sh test/*.sh
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  # A throwaway OpenBao that trusts this job's GitHub OIDC tokens, and an sshd
  # that trusts its SSH CA: the certificates must actually log in.
  e2e:
    runs-on: ubuntu-latest
    # Fork pull requests get no OIDC token.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    env:
      VAULT_ADDR: http://127.0.0.1:8200
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start OpenBao and sshd
        run: test/setup.sh
        env:
          OPENBAO_IMAGE: quay.io/openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf

      # The documented flow: vault-action exports VAULT_TOKEN, VAULT_ADDR is
      # set on the job.
      - uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          path: github-actions
          role: ci
          exportToken: true
      - name: Explicit principal
        id: principal
        uses: ./
        with:
          ssh-role: deploy
          principals: deploy:test
      - name: Check
        env:
          KEY: ${{ steps.principal.outputs.key-path }}
          CERT: ${{ steps.principal.outputs.cert-path }}
        run: test/check.sh deploy:test

      - name: The role's default principal, a TTL
        id: default
        uses: ./
        with:
          ssh-role: automation
          ttl: 5m
      - name: Check
        env:
          KEY: ${{ steps.default.outputs.key-path }}
          CERT: ${{ steps.default.outputs.cert-path }}
        run: test/check.sh automation

      # A second login whose token is passed explicitly, while VAULT_TOKEN and
      # VAULT_ADDR point elsewhere.
      - uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        id: login
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          path: github-actions
          role: ci
          outputToken: true
      - name: Explicit url and token
        id: explicit
        uses: ./
        env:
          VAULT_ADDR: http://127.0.0.1:1
          VAULT_TOKEN: wrong
        with:
          url: http://127.0.0.1:8200/
          token: ${{ steps.login.outputs.vault_token }}
          ssh-role: deploy
          principals: deploy:test
      - name: Check
        env:
          KEY: ${{ steps.explicit.outputs.key-path }}
          CERT: ${{ steps.explicit.outputs.cert-path }}
        run: test/check.sh deploy:test

      - name: A principal the role does not allow
        id: denied
        continue-on-error: true
        uses: ./
        with:
          ssh-role: deploy
          principals: root
      - name: A bad token
        id: badtoken
        continue-on-error: true
        uses: ./
        with:
          token: wrong
          ssh-role: deploy
          principals: deploy:test
      - name: Check
        env:
          DENIED: ${{ steps.denied.outcome }}
          BADTOKEN: ${{ steps.badtoken.outcome }}
        run: |
          test "$DENIED" = failure
          test "$BADTOKEN" = failure
