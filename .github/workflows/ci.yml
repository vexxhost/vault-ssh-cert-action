name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: dist/ is up to date
        run: |
          npm run build
          git diff --exit-code dist
      - run: shellcheck test/*.sh
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  # A throwaway OpenBao that trusts this job's GitHub OIDC tokens, and an sshd
  # that trusts its SSH CA: the certificates must actually log in.
  e2e:
    runs-on: ubuntu-latest
    # Fork pull requests get no OIDC token.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    env:
      VAULT_ADDR: http://127.0.0.1:8200
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The runner starts no ssh-agent
        run: test -z "${SSH_AUTH_SOCK:-}"
      - name: Start OpenBao and sshd
        run: test/setup.sh
        env:
          OPENBAO_IMAGE: quay.io/openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
      - name: Mark the time
        run: touch "$RUNNER_TEMP/marker"

      # The documented flow: vault-action exports VAULT_TOKEN, VAULT_ADDR is
      # set on the job.
      - uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          path: github-actions
          role: ci
          exportToken: true
      - name: Explicit principal
        id: principal
        uses: ./
        with:
          ssh-role: deploy
          principals: deploy:test
      - name: Check
        run: test/check.sh deploy:test

      - name: The role's default principal, a TTL
        uses: ./
        with:
          ssh-role: automation
          ttl: 5m
      - name: Check
        run: test/check.sh automation

      - name: Bound to the role's addresses and the runner's public IP
        uses: ./
        with:
          ssh-role: restricted
          principals: deploy:test
          add-public-ip: 'true'
      - name: Check
        run: |
          test/check.sh deploy:test
          ip=$(curl -fsS https://ipv4.icanhazip.com)
          ssh-add -L | ssh-keygen -L -f - | grep -F "source-address 127.0.0.1/32,192.0.2.0/24,$ip/32"
      - name: add-public-ip with a role without source-address
        id: nobase
        continue-on-error: true
        uses: ./
        with:
          ssh-role: deploy
          principals: deploy:test
          add-public-ip: 'true'

      # A second login whose token is passed explicitly, while VAULT_TOKEN and
      # VAULT_ADDR point elsewhere.
      - uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        id: login
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          path: github-actions
          role: ci
          outputToken: true
      - name: Explicit url and token
        id: explicit
        uses: ./
        env:
          VAULT_ADDR: http://127.0.0.1:1
          VAULT_TOKEN: wrong
        with:
          url: http://127.0.0.1:8200/
          token: ${{ steps.login.outputs.vault_token }}
          ssh-role: deploy
          principals: deploy:test
      - name: Check
        env:
          SOCK: ${{ steps.explicit.outputs.ssh-auth-sock }}
        run: |
          test "$SOCK" = "$SSH_AUTH_SOCK"
          test/check.sh deploy:test

      # Run this step's post (normally at the end of the job) now, to check it.
      - name: Clean up the last one early
        env:
          SOCK: ${{ steps.explicit.outputs.ssh-auth-sock }}
          TOKEN: ${{ steps.login.outputs.vault_token }}
        run: |
          env "STATE_agent-pid=$SSH_AGENT_PID" "STATE_agent-dir=$(dirname "$SOCK")" \
            INPUT_URL=http://127.0.0.1:8200 "INPUT_TOKEN=$TOKEN" INPUT_REVOKE-TOKEN=true \
            node dist/post/index.js
          test ! -e "$SOCK"
      - name: Check the cleanup
        env:
          SOCK: ${{ steps.explicit.outputs.ssh-auth-sock }}
          TOKEN: ${{ steps.login.outputs.vault_token }}
        run: |
          if pgrep -f "ssh-agent -D -a $SOCK" >/dev/null; then exit 1; fi
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "X-Vault-Token: $TOKEN" "$VAULT_ADDR/v1/auth/token/lookup-self")" = 403
          # No private key was ever written to disk.
          if grep -rIl 'PRIVATE KEY' "$RUNNER_TEMP" "$HOME" "$GITHUB_WORKSPACE" /tmp 2>/dev/null; then exit 1; fi

      - name: A principal the role does not allow
        id: denied
        continue-on-error: true
        uses: ./
        with:
          ssh-role: deploy
          principals: root
      - name: A bad token
        id: badtoken
        continue-on-error: true
        uses: ./
        with:
          token: wrong
          ssh-role: deploy
          principals: deploy:test
      - name: Check
        env:
          DENIED: ${{ steps.denied.outcome }}
          BADTOKEN: ${{ steps.badtoken.outcome }}
          NOBASE: ${{ steps.nobase.outcome }}
        run: |
          test "$DENIED" = failure
          test "$BADTOKEN" = failure
          test "$NOBASE" = failure
