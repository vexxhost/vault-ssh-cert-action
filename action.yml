name: Vault SSH certificate
description: >-
  Sign an in-memory SSH key with HashiCorp Vault's (or OpenBao's) SSH secrets
  engine and load it into a private ssh-agent for the rest of the job. Log in
  first with hashicorp/vault-action (exportToken: true).
author: VEXXHOST
branding:
  icon: lock
  color: blue

inputs:
  ssh-role:
    description: SSH role to sign with.
    required: true
  principals:
    description: >-
      Comma-separated principals to request (valid_principals). Empty leaves
      them to the SSH role's default_user.
    default: ''
  ttl:
    description: Requested certificate TTL (e.g. 1h). Empty uses the role's.
    default: ''
  ssh-path:
    description: Mount path of the SSH secrets engine.
    default: ssh-client-signer
  url:
    description: Vault address. Defaults to $VAULT_ADDR.
    default: ''
  token:
    description: Vault token. Defaults to $VAULT_TOKEN, as exported by hashicorp/vault-action.
    default: ''
  add-public-ip:
    description: >-
      Restrict the certificate to the SSH role's default source-address plus
      the runner's public IPv4 address (from Azure's instance metadata on
      GitHub-hosted runners, else ipv4.icanhazip.com). The token needs read on
      <ssh-path>/roles/<ssh-role>, and its policy must allow critical_options.
    default: 'false'
  revoke-token:
    description: Revoke the Vault token at the end of the job.
    default: 'true'

outputs:
  ssh-auth-sock:
    description: The agent's socket, also exported as SSH_AUTH_SOCK.
  certificate:
    description: The signed certificate (public).
  public-key:
    description: The certified public key.

runs:
  using: node24
  main: dist/main/index.js
  post: dist/post/index.js
  post-if: always()
